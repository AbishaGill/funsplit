plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.finsplit.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.finsplit.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Replace with your real keystore once generated:
            //   keytool -genkey -v -keystore keystore/finsplit.keystore
            //           -alias finsplit -keyalg RSA -keysize 2048 -validity 10000
            storeFile file("keystore/finsplit.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "PLACEHOLDER"
            keyAlias System.getenv("KEY_ALIAS") ?: "finsplit"
            keyPassword System.getenv("KEY_PASSWORD") ?: "PLACEHOLDER"
        }
    }

    buildTypes {
        release {
            // Only apply signing if the keystore file actually exists.
            // Run:  ./gradlew assembleRelease  after placing your keystore.
            if (file("keystore/finsplit.keystore").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Firebase BOM — manages versions for all firebase libraries
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'   // FCM push notifications

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'

    // Glide image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.fragment:fragment:1.8.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // WorkManager — background periodic tasks (weekly report)
    implementation 'androidx.work:work-runtime:2.9.0'
    // Guava ListenableFuture needed by WorkManager at compile time on Java-only projects
    implementation 'com.google.guava:guava:32.1.2-android'
}
